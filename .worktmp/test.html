<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Building render test</title>
<style>
  body { background:#222; color:#ddd; font-family: monospace; margin: 16px; }
  h2 { color:#fff; margin-top: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .card { background:#151515; padding: 8px; border-radius: 6px; text-align: center; }
  canvas { background: #2a2a2a; image-rendering: pixelated; }
  .label { color:#9ab; font-size: 11px; margin-top: 4px; }
  .terr { background: #c4a464; }
</style>
</head>
<body>
<h1>Dimetric building render test</h1>

<h2>Buildings rendered on terrain (diamond bottom at tile bottom)</h2>
<div class="row" id="buildings"></div>

<h2>Building images (raw, with bounding boxes)</h2>
<div class="row" id="raw"></div>

<script type="module">
import { renderBuilding, drawBuilding, getBuildingPreview, TILE_SIZE } from "./tile-renderer.js";

const FACTIONS = ['atreides', 'harkonnen', 'ordos'];
const BUILDINGS = [
  { type: 'palace',    w: 2, h: 2 },
  { type: 'barracks',  w: 2, h: 2 },
  { type: 'factory',   w: 3, h: 2 },
  { type: 'refinery',  w: 2, h: 2 },
  { type: 'generator', w: 2, h: 2 },
  { type: 'turret',    w: 1, h: 1 },
];

// === 1. Render each building on a "tile footprint" backdrop ===
const bdiv = document.getElementById('buildings');
for (const fac of FACTIONS) {
  for (const b of BUILDINGS) {
    const cw = b.w * TILE_SIZE + 80;
    const ch = b.h * TILE_SIZE + 80;
    const canv = document.createElement('canvas');
    canv.width = cw; canv.height = ch;
    const ctx = canv.getContext('2d');
    // terrain-ish background
    ctx.fillStyle = '#c4a464';
    ctx.fillRect(0, 0, cw, ch);
    // tile footprint indicator (white outline)
    const fx = 40, fy = 40;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(fx + 0.5, fy + 0.5, b.w * TILE_SIZE, b.h * TILE_SIZE);
    // draw the building at the footprint's top-left
    drawBuilding(ctx, b.type, fac, fx, fy, b.w, b.h);
    const card = document.createElement('div');
    card.className = 'card';
    card.appendChild(canv);
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = `${fac} ${b.type} (${b.w}x${b.h})`;
    card.appendChild(lbl);
    bdiv.appendChild(card);
  }
}

// === 2. Show raw building images with bounding boxes ===
const rdiv = document.getElementById('raw');
for (const b of BUILDINGS) {
  const img = renderBuilding(b.type, 'atreides', b.w, b.h);
  const canv = document.createElement('canvas');
  canv.width = img.width; canv.height = img.height;
  const ctx = canv.getContext('2d');
  // checkerboard backdrop
  for (let y = 0; y < img.height; y += 8) {
    for (let x = 0; x < img.width; x += 8) {
      ctx.fillStyle = (((x/8)+(y/8))%2===0) ? '#333' : '#444';
      ctx.fillRect(x, y, 8, 8);
    }
  }
  ctx.drawImage(img, 0, 0);
  const card = document.createElement('div');
  card.className = 'card';
  card.appendChild(canv);
  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = `${b.type} ${img.width}x${img.height}`;
  card.appendChild(lbl);
  rdiv.appendChild(card);
}
</script>
</body>
</html>
